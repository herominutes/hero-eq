<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Hero EQ evolution timeline</title>
<desc id="d">From a first commit on 18 October 2026 with an Expo scaffold, to native SwiftUI, a first run on an iPhone on 19 October, a focus pass and onboarding on 22 October, and external testing still to be decided.</desc>
<rect width="1200" height="370" rx="14" fill="#0f172a"/>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">How Hero EQ evolved in its first week</text>
<line x1="100" y1="175" x2="1100" y2="175" stroke="#334155" stroke-width="3"/>
<rect x="32" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#60a5fa" stroke-width="2.5"/>
<text x="100" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="100" dy="0">First commit</tspan></text>
<text x="100" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#60a5fa">18 Oct 2026</text>
<text x="100" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="100" dy="0">Expo / React Native</tspan><tspan x="100" dy="17">scaffold</tspan></text>
<rect x="282" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#60a5fa" stroke-width="2.5"/>
<text x="350" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="350" dy="0">Native SwiftUI</tspan></text>
<text x="350" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#60a5fa">18 Oct 2026</text>
<text x="350" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="350" dy="0">Replaced the</tspan><tspan x="350" dy="17">scaffold within</tspan><tspan x="350" dy="17">hours</tspan></text>
<rect x="532" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#4ade80" stroke-width="2.5"/>
<text x="600" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="600" dy="0">First iPhone</tspan><tspan x="600" dy="18">run</tspan></text>
<text x="600" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4ade80">19 Oct 2026</text>
<text x="600" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="600" dy="0">Internal TestFlight</tspan><tspan x="600" dy="17">builds begin</tspan></text>
<rect x="782" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#4ade80" stroke-width="2.5"/>
<text x="850" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="850" dy="0">Focus pass</tspan></text>
<text x="850" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4ade80">22 Oct 2026</text>
<text x="850" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="850" dy="0">27 specialists cut</tspan><tspan x="850" dy="17">to 12, plus</tspan><tspan x="850" dy="17">onboarding</tspan></text>
<rect x="1032" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1100" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="1100" dy="0">External</tspan><tspan x="1100" dy="18">testing</tspan></text>
<text x="1100" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8">TBD</text>
<text x="1100" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="1100" dy="0">Not started</tspan></text>
<text x="600" y="322" text-anchor="middle" font-size="13" fill="#94a3b8">Dates are from the repo's changelog and backlog. The product name changed four times: Product Brain, Hero EQ, PocketPM, then Hero EQ again.</text>
</svg>
