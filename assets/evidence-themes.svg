<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Evidence themes</title>
<desc id="d">Horizontal bar chart of public posts and reviews per theme: AI product building 28, recall 18, note-to-ticket 17, PRDs and status updates 14, customer insight 14, decision memory 10, growth 10, meeting prep 3.</desc>
<rect width="1200" height="490" rx="14" fill="#0f172a"/>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">What 919 public posts and reviews talked about</text>
<text x="600" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">Items per theme. The evidence study covered posts and reviews, not interviews with product leaders.</text>
<text x="386" y="117" text-anchor="end" font-size="14" fill="#e2e8f0">AI product building: evals, prompts, cost</text>
<rect x="400" y="100" width="448" height="24" rx="4" fill="#fbbf24"/>
<text x="858" y="117" font-size="14" font-weight="700" fill="#f8fafc">28</text>
<text x="386" y="157" text-anchor="end" font-size="14" fill="#e2e8f0">Recall across calls and notes</text>
<rect x="400" y="140" width="288" height="24" rx="4" fill="#60a5fa"/>
<text x="698" y="157" font-size="14" font-weight="700" fill="#f8fafc">18</text>
<text x="386" y="197" text-anchor="end" font-size="14" fill="#e2e8f0">Note-to-ticket and tool friction</text>
<rect x="400" y="180" width="272" height="24" rx="4" fill="#60a5fa"/>
<text x="682" y="197" font-size="14" font-weight="700" fill="#f8fafc">17</text>
<text x="386" y="237" text-anchor="end" font-size="14" fill="#e2e8f0">PRDs, status updates, comms</text>
<rect x="400" y="220" width="224" height="24" rx="4" fill="#60a5fa"/>
<text x="634" y="237" font-size="14" font-weight="700" fill="#f8fafc">14</text>
<text x="386" y="277" text-anchor="end" font-size="14" fill="#e2e8f0">Customer insight synthesis</text>
<rect x="400" y="260" width="224" height="24" rx="4" fill="#60a5fa"/>
<text x="634" y="277" font-size="14" font-weight="700" fill="#f8fafc">14</text>
<text x="386" y="317" text-anchor="end" font-size="14" fill="#e2e8f0">Decision memory</text>
<rect x="400" y="300" width="160" height="24" rx="4" fill="#60a5fa"/>
<text x="570" y="317" font-size="14" font-weight="700" fill="#f8fafc">10</text>
<text x="386" y="357" text-anchor="end" font-size="14" fill="#e2e8f0">Growth, experiments, metrics</text>
<rect x="400" y="340" width="160" height="24" rx="4" fill="#60a5fa"/>
<text x="570" y="357" font-size="14" font-weight="700" fill="#f8fafc">10</text>
<text x="386" y="397" text-anchor="end" font-size="14" fill="#e2e8f0">Meeting, 1:1 and board prep</text>
<rect x="400" y="380" width="48" height="24" rx="4" fill="#60a5fa"/>
<text x="458" y="397" font-size="14" font-weight="700" fill="#f8fafc">3</text>
<text x="900" y="117" font-size="12.5" fill="#fde68a">Largest cluster, smallest audience</text>
<text x="600" y="450" text-anchor="middle" font-size="13" fill="#94a3b8">173 items carried a verified pain signal. The sources lean toward developers and unhappy app reviewers.</text>
<text x="600" y="470" text-anchor="middle" font-size="13" fill="#94a3b8">Treat this as a shortlist to test, not a verdict on what product leaders want.</text>
</svg>
